<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보물섬 퀴즈 탐험</title>
    <!-- 내부 스타일시트 -->
     <style>
        /* body 태그에 적용 */
        body{
            font-family: Arial, sans-serif;
            padding: 24px;
            background: #f7f3e8;
        }
        .treasure-row {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .treasure {
            width: 200px;
            height: 150px;
            background: skyblue;
            border: 5px solid brown;
            border-radius: 18px;
            text-align: center;
            line-height: 150px;
            font-size: 22px;
        }
     </style>
</head>
<body>
    <h1>🏝🏕보물섬 퀴즈 탐험🏕🏝</h1>

    <!-- flex 박스를 이용 가로(row)로 배치-->
     <div class="treasure-row">
        <!-- 보물상자가 있는 곳 -->
        <div class="treasure">💎보석💎</div>
        <div class="treasure">🏆황금🏆</div>
        <div class="treasure">🌍보물지도🌍</div>
     </div>
</body>
</html>
